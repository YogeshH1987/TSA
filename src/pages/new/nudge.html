<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="shortcut icon" href="/images/favicon.png" />

    <title>Nudge pop-ups</title>
    <meta name="description" content="description goes here" />
    <link rel="stylesheet" href="/css/fonts.css" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/vendor.css" />
    <link rel="stylesheet" href="/components/cp-drawer/cp-drawer.css" />
    <link rel="stylesheet" href="/components/cp-form/cp-form.css" />
</head>

<body>
    <div class="main">

        <section class="bs-sec">
            <div class="container">
                <div class="sec-cont">
                    <button class="btn btn-primary js-drawer" data-id="leaving-soon">leaving-soon</button>
                    <button class="btn btn-primary js-drawer" data-id="need-assistance">need-assistance</button>
                </div>
            </div>
        </section>
       
    </div>

    <div class="cm-overlay"></div>
    <!-- leaving-soon start -->
    <div class="cp-drawer typ-leaving-soon" id="leaving-soon">
        <div class="head-sec">
            <h2 class="drawer-title">Hello! Leaving so soon?</h2>
            <a href="#" class="icon icon-close js-close-btn"></a>
        </div>
        <div class="cont-wrap">
            <h3 class="drawer-sub-title">Tell us why you are leaving</h3>
            <div class="cp-form typ-leaving-soon">
                <div class="radio-wrap form-group">
                    <div class="bs-radio">
                        <input id="radio1" name="size" type="radio">
                        <label for="radio1" class="custom-radio">
                            Need product later
                        </label>
                    </div>
                    <div class="bs-radio">
                        <input id="radio2" name="size" type="radio">
                        <label for="radio2" class="custom-radio">
                            Need better offers
                        </label>
                    </div>
                    <div class="bs-radio">
                        <input id="radio3" name="size" type="radio">
                        <label for="radio3" class="custom-radio">
                            Need better offers
                        </label>
                    </div>
                    <div class="bs-radio">
                        <input id="radio4" name="size" type="radio">
                        <label for="radio4" class="custom-radio">
                            Need more information on product
                        </label>
                    </div>
                </div>     
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" id="name" class="form-control validate-name" value="Ram Kumar" placeholder="" required="">
                    <span class="error-msg"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Mobile number</label>
                    <input type="text" id="mobile-number" class="form-control validate-mobile" value="9808765678" placeholder="" required="">
                    <span class="error-msg"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Tell us more</label>
                    <textarea id="query" rows="4" class="form-control" placeholder="Write your query here" cols="50"></textarea>
                    <span class="error-msg"></span>
                </div>

                <div class="btn-wrap">
                    <div class="note">
                        Please contact 1800-108-8282 for order booking.<br/>
                        <a href="#" class="btn-link">Click here</a> for new offers.
                    </div>
                    <button class="btn" type="button">Submit</button>
                </div>
            </div>
        </div>
    </div>
    <!-- leaving-soon end -->
    <!-- need-assistance start -->
    <div class="cp-drawer typ-leaving-soon" id="need-assistance">
        <div class="head-sec">
            <h2 class="drawer-title">Need assistance?</h2>
            <a href="#" class="icon icon-close js-close-btn"></a>
        </div>
        <div class="cont-wrap">
            <div class="cp-form typ-leaving-soon">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" id="name" class="form-control validate-name" value="Ram Kumar" placeholder="" required="">
                    <span class="error-msg"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Contact number</label>
                    <input type="text" id="mobile-number" class="form-control validate-mobile" value="9808765678" placeholder="" required="">
                    <span class="error-msg"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control validate-email" value="abc@gmail.com"
                        placeholder="" required="">
                    <span class="error-msg"></span>
                </div>
                <div class="form-group error">
                    <label class="form-label">Delivery pincode</label>
                    <input type="text" id="pincode" class="form-control validate-field" value="400004"
                        placeholder="" required="">
                    <span class="error-msg"></span>
                </div>
                <div class="form-group">
                    <label class="form-label">Message</label>
                    <textarea id="query" rows="4" class="form-control" placeholder="Write your query here" cols="50"></textarea>
                    <span class="error-msg"></span>
                </div>

                <div class="btn-wrap">  
                    <button class="btn" type="button">Submit</button>
                </div>
            </div>
        </div>
    </div>
    <!-- need-assistance end -->
    <!-- build:js assets/js/vendor.js -->
    <script src="/js/vendor/jquery-3.7.1.min.js"></script>
    <script src="/js/vendor/swiper-bundle.min.js"></script>
    <script src="/js/vendor/isotope.pkgd.min.js"></script>

    <!-- endbuild -->
    <!-- build:js assets/js/custom.min.js -->
    <script src="/js/global.js"></script>
    <script src="../components/cp-drawer/cp-drawer.js"></script>

    <script src="/js/form-validation.js"></script>
    <!-- endbuild -->
</body>

</html>
